<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ground Control — Pattern Editor</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#15181d; --panel2:#1b1f26; --line:#2a2f38;
    --fg:#e7e9ec; --muted:#8b93a1; --accent:#ff3b3b; --accent2:#28d7c3;
    --key:#12151a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
  header{display:flex;gap:14px;align-items:center;padding:10px 14px;
    border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10;flex-wrap:wrap}
  h1{font-size:14px;margin:0;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .grp{display:flex;gap:6px;align-items:center}
  label{color:var(--muted)}
  select,input[type=number]{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:4px;padding:3px 6px;font:inherit}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:4px;
    padding:5px 10px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.tab.active{border-color:var(--accent2);color:var(--accent2)}
  main{padding:12px}
  .roll{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .keys{flex:0 0 64px;background:var(--panel);border-right:1px solid var(--line)}
  .key{height:18px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;
    font-size:10px;color:var(--muted);border-bottom:1px solid #191c22}
  .key.black{background:#0a0c0f;color:#5b6270}
  .grid{flex:1;overflow:auto;max-height:64vh}
  .row{display:flex}
  .cell{width:22px;height:18px;border-right:1px solid #191c22;border-bottom:1px solid #191c22;
    background:var(--key);flex:0 0 22px}
  .cell.beat{border-left:1px solid #343b47}
  .cell.bar{background:#0f1217}
  .cell.blackrow{background:#0a0c0f}
  .cell:hover{outline:1px solid var(--accent2);outline-offset:-1px}
  .cell.on{background:var(--accent)!important}
  .cell.on.multi{background:var(--accent2)!important}
  .steps{display:flex;margin-left:64px}
  .scell{width:22px;flex:0 0 22px;text-align:center;font-size:9px;color:var(--muted);
    border-right:1px solid #191c22;padding:2px 0}
  .scell.beat{color:var(--accent2);font-weight:700}
  .lanes{margin-top:12px}
  .lane{display:flex;align-items:center;gap:8px;margin:6px 0;border:1px solid var(--line);
    border-radius:6px;padding:8px;background:var(--panel)}
  .ccbar{display:flex;gap:2px}
  .cc{width:22px;height:60px;background:var(--key);border:1px solid #191c22;position:relative;
    cursor:pointer;border-radius:2px;overflow:hidden}
  .cc .fill{position:absolute;bottom:0;left:0;right:0;background:var(--accent2);opacity:.75}
  .cc .lbl{position:absolute;top:1px;left:0;right:0;text-align:center;font-size:8px;color:#0d0f12}
  .hint{color:var(--muted);font-size:11px;margin:4px 0 10px}
  .badge{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
</style>
</head>
<body>
<header>
  <h1>GC Pattern Editor</h1>
  <div class="grp">
    <label>Steps</label>
    <select id="stepsSel">
      <option>16</option><option selected>32</option><option>64</option><option>128</option>
    </select>
  </div>
  <div class="grp">
    <label>Octave</label>
    <button id="octDown">−</button><span id="octLabel">C3</span><button id="octUp">+</button>
  </div>
  <div class="grp tabs" id="tabs"></div>
  <div class="grp">
    <label>Velocity</label>
    <input id="vel" type="number" min="1" max="127" value="100" style="width:56px">
  </div>
  <div class="grp" style="margin-left:auto">
    <button id="clear">Clear track</button>
    <button id="importBtn">Import</button>
    <input id="importFile" type="file" accept=".json" hidden>
    <button id="exportBtn" class="primary">Export JSON</button>
  </div>
</header>

<main>
  <div class="hint">Click a cell to place/remove a note. Click a CC cell to set that step's CC value (right-click clears it). Notes carry velocity; the same step holds a whole chord.</div>
  <div class="roll">
    <div class="keys" id="keys"></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="steps" id="stepHeader"></div>

  <div class="lanes">
    <div class="lane">
      <label>CC#</label><input id="ccNum" type="number" min="0" max="127" value="74" style="width:64px">
      <label>Value</label><input id="ccVal" type="number" min="0" max="127" value="64" style="width:64px">
      <div class="ccbar" id="ccbar"></div>
    </div>
  </div>
</main>

<script>
(() => {
  "use strict";
  const TRACKS = 3;
  const NOTE_LOW_BASE = 48;           // C3 when octave index 0
  const ROWS = 25;                    // show ~2 octaves
  const CC_LANES = 1;

  const state = {
    steps: 32,
    octave: 0,                        // octave offset from C3
    track: 1,
    tracks: {},                       // trackNum -> {steps:[ {notes:[[n,v]], cc:[[c,v]], modifier:0, ratchet:0 }]}
  };
  const basePitch = () => NOTE_LOW_BASE + state.octave * 12;

  function ensureTrack(t){
    if(!state.tracks[t]){
      state.tracks[t] = [];
      for(let i=0;i<128;i++) state.tracks[t].push({notes:[], cc:[], modifier:0, ratchet:0});
    }
    return state.tracks[t];
  }
  function resizeAll(){
    for(let t=1;t<=TRACKS;t++) ensureTrack(t);
  }

  // ---- rendering ----
  const $ = id => document.getElementById(id);
  const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const isBlack = n => NOTE_NAMES[n%12].includes("#");
  const noteName = n => NOTE_NAMES[n%12] + (Math.floor(n/12)-1);

  function buildKeys(){
    const keys = $("keys"); keys.innerHTML = "";
    for(let r=ROWS-1;r>=0;r--){
      const pitch = basePitch()+r;
      const d = document.createElement("div");
      d.className = "key" + (isBlack(pitch)?" black":"");
      d.textContent = noteName(pitch);
      keys.appendChild(d);
    }
  }

  function cellAt(step,pitch){
    const st = ensureTrack(state.track)[step];
    return st.notes.findIndex(p => p[0]===pitch);
  }

  function buildGrid(){
    const grid = $("grid"); grid.innerHTML = "";
    for(let r=ROWS-1;r>=0;r--){
      const pitch = basePitch()+r;
      const row = document.createElement("div"); row.className="row";
      for(let s=0;s<state.steps;s++){
        const c = document.createElement("div");
        c.className = "cell" + (isBlack(pitch)?" blackrow":"")
          + (s%4===0?" beat":"") + (s%16===0?" bar":"");
        c.dataset.p = pitch; c.dataset.s = s;
        if(cellAt(s,pitch) >= 0) c.classList.add("on");
        c.addEventListener("click", () => toggleNote(s,pitch));
        row.appendChild(c);
      }
      grid.appendChild(row);
    }
    // scroll so middle C-ish is visible
    grid.scrollTop = grid.scrollHeight - grid.clientHeight*0.6;
  }

  function buildStepHeader(){
    const h = $("stepHeader"); h.innerHTML="";
    for(let s=0;s<state.steps;s++){
      const d=document.createElement("div");
      d.className="scell"+(s%4===0?" beat":"");
      d.textContent = (s%4===0)? (s+1):"";
      h.appendChild(d);
    }
  }

  function buildCC(){
    const bar = $("ccbar"); bar.innerHTML="";
    const ccNum = +$("ccNum").value;
    const st = ensureTrack(state.track);
    for(let s=0;s<state.steps;s++){
      const cell=document.createElement("div"); cell.className="cc";
      const entry = st[s].cc.find(c=>c[0]===ccNum);
      if(entry){
        const f=document.createElement("div"); f.className="fill";
        f.style.height=(entry[1]/127*100)+"%"; cell.appendChild(f);
        const l=document.createElement("div"); l.className="lbl"; l.textContent=entry[1]; cell.appendChild(l);
      }
      cell.addEventListener("click", ()=>setCC(s,ccNum,+$("ccVal").value));
      cell.addEventListener("contextmenu", e=>{e.preventDefault(); setCC(s,ccNum,null);});
      bar.appendChild(cell);
    }
  }

  function toggleNote(step,pitch){
    const st = ensureTrack(state.track)[step];
    const i = st.notes.findIndex(p=>p[0]===pitch);
    if(i>=0) st.notes.splice(i,1);
    else st.notes.push([pitch, +$("vel").value]);
    redraw();
  }
  function setCC(step,ccNum,val){
    const st = ensureTrack(state.track)[step];
    const i = st.cc.findIndex(c=>c[0]===ccNum);
    if(val===null){ if(i>=0) st.cc.splice(i,1); }
    else if(i>=0) st.cc[i][1]=val;
    else st.cc.push([ccNum,val]);
    buildCC();
  }

  function buildTabs(){
    const t=$("tabs"); t.innerHTML="";
    for(let i=1;i<=TRACKS;i++){
      const b=document.createElement("button");
      b.className="tab"+(state.track===i?" active":"");
      b.textContent="Track "+i;
      b.onclick=()=>{state.track=i; redraw();};
      t.appendChild(b);
    }
  }

  function redraw(){ buildTabs(); buildKeys(); buildGrid(); buildStepHeader(); buildCC(); }

  // ---- export / import ----
  function trackObj(t){
    const steps = ensureTrack(t).slice(0, state.steps).map(s=>({
      modifier: s.modifier||0,
      notes: s.notes.map(p=>[p[0],p[1]]),
      cc: s.cc.map(c=>[c[0],c[1]])
    }));
    // legacy single-note fallback (lowest note) for old firmware
    const legacy = steps.map(s=>{
      if(!s.notes.length) return {note:"", velocity:0, modifier:s.modifier};
      const lowest = s.notes.reduce((a,b)=>b[0]<a[0]?b:a, s.notes[0]);
      return {note: noteName(lowest[0]), velocity: lowest[1], modifier: s.modifier};
    });
    return { index:t, steps2: steps, steps: legacy, ratchets: steps.map(()=>0) };
  }
  function exportJSON(){
    const doc = {
      app:"gc-pattern-editor", version:1, steps:state.steps, store:"steps2",
      tracks: [1,2,3].map(trackObj)
    };
    return JSON.stringify(doc, null, 2);
  }
  function doExport(){
    const blob = new Blob([exportJSON()], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "gc-pattern.json";
    a.click();
    URL.revokeObjectURL(a.href);
  }
  function doImport(text){
    const doc = JSON.parse(text);
    if(doc.steps) state.steps = doc.steps, $("stepsSel").value=String(doc.steps);
    state.tracks={};
    for(const tr of (doc.tracks||[])){
      const arr = ensureTrack(tr.index);
      const src = tr.steps2 || (tr.steps||[]).map(s=>({
        modifier:s.modifier||0,
        notes: s.note ? [[ /*name->midi*/ nameToMidi(s.note), s.velocity||0 ]] : [],
        cc:[]
      }));
      for(let i=0;i<src.length && i<128;i++){
        arr[i] = {modifier:src[i].modifier||0,
          notes:(src[i].notes||[]).map(p=>[p[0],p[1]]),
          cc:(src[i].cc||[]).map(c=>[c[0],c[1]]), ratchet:0};
      }
    }
    redraw();
  }
  function nameToMidi(s){
    if(!s) return null;
    const pc = NOTE_NAMES.indexOf(s.slice(0,-1));
    const oc = parseInt(s.slice(-1),10);
    return (oc+1)*12 + pc;
  }

  // ---- wire up ----
  $("stepsSel").onchange = e => { state.steps=+e.target.value; redraw(); };
  $("octUp").onclick = ()=>{ state.octave=Math.min(4,state.octave+1); $("octLabel").textContent="C"+(3+state.octave); redraw(); };
  $("octDown").onclick= ()=>{ state.octave=Math.max(-3,state.octave-1); $("octLabel").textContent="C"+(3+state.octave); redraw(); };
  $("ccNum").onchange = buildCC;
  $("clear").onclick = ()=>{ state.tracks[state.track]=null; ensureTrack(state.track); redraw(); };
  $("exportBtn").onclick = doExport;
  $("importBtn").onclick = ()=>$("importFile").click();
  $("importFile").onchange = e=>{ const f=e.target.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=()=>doImport(r.result); r.readAsText(f); };

  resizeAll(); redraw();

  // test hooks
  window.__app = { state, exportJSON, toggleNote, setCC, redraw, noteName, nameToMidi };
})();
</script>
</body>
</html>
